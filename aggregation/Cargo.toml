[package]
name = "midnight-aggregation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Toolkit for proof aggregation of midnight-proofs"
license = "MIT OR Apache-2.0"
categories = ["cryptography"]
keywords = ["halo", "proofs", "zkp", "zkSNARKs", "aggregation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lints]
workspace = true

[dependencies]
group = { workspace = true }
ff = { workspace = true }
midnight-curves = "0.4.0-rc.1"
midnight-proofs = { version = "0.9.0-rc.1", default-features = false, features = [
    "circuit-params",
    "committed-instances",
] }
midnight-circuits = { version = "8.0.0-rc.1", default-features = false, features = [
    "testing",
] }
midnight-zk-stdlib = { path = "../zk_stdlib", version = "3.0.0-rc.1" }

rand = { workspace = true }
blake2b_simd = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rand_chacha = { workspace = true }
