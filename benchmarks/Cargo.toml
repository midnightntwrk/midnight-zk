[package]
name = "midnight-benchmarks"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standard prover benchmarks and profiling for midnight-zk"
publish = false

[lints]
workspace = true

[dependencies]
midnight-curves = { path = "../curves" }
midnight-proofs = { path = "../proofs", default-features = false, features = [
    "circuit-params",
    "committed-instances",
] }
midnight-circuits = { path = "../circuits", features = ["testing"] }
midnight-zk-stdlib = { path = "../zk_stdlib" }
midnight-aggregation = { path = "../aggregation" }

ff = { workspace = true }
group = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake2b_simd = { workspace = true }
sha2 = { workspace = true }
clap = { version = "4.6", features = ["derive"] }

[features]
# Reports the time the prover spends in MSMs, FFTs and polynomial evaluations.
profiling = ["midnight-proofs/profiling"]
# The parallel CPU paths of the GPU prover (`crate::par` in midnight-proofs), with no device.
prover-par = ["midnight-proofs/prover-par"]
# The accelerator hooks of midnight-proofs. The prover runs on the CPU until a backend installs
# its hooks, see the README.
gpu = ["midnight-proofs/gpu"]
