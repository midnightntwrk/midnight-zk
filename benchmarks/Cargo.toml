[package]
name = "midnight-benchmarks"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standard prover benchmarks for midnight-zk"
publish = false

[lints]
workspace = true

[dependencies]
midnight-curves = { path = "../curves" }
midnight-proofs = { path = "../proofs", default-features = false, features = [
    "circuit-params",
    "committed-instances",
] }
midnight-circuits = { path = "../circuits", features = ["testing"] }
midnight-zk-stdlib = { path = "../zk_stdlib" }
midnight-aggregation = { path = "../aggregation" }

ff = { workspace = true }
group = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake2b_simd = { workspace = true }
sha2 = { workspace = true }
clap = { version = "4.6", features = ["derive"] }

