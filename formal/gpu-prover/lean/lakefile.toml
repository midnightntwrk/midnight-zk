name = "gpu_spec_oracle"
defaultTargets = ["GpuSpec", "oracle"]

# Every module under GpuSpec/ (the spec, the pins and the axiom audit) is built
# by default, so `lake build --wfail` sees a `sorry` in any of them.
[[lean_lib]]
name = "GpuSpec"
globs = ["GpuSpec.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
