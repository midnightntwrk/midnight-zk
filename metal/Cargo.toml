[package]
name = "midnight-metal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = """
Metal kernels for the midnight-proofs accelerator hooks on Apple GPUs: BLS12-381 field arithmetic, the device context, and the MSM, NTT and quotient entry points
"""
license = "Apache-2.0"
categories = ["cryptography"]
keywords = ["metal", "gpu", "msm", "ntt", "zkp"]
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Test only: the test switches, test entry points and test kernels, for this
# crate's tests and those of `midnight-gpu-prover`.
test-support = []

[dependencies]
blst = "0.3.15"

[target.'cfg(target_os = "macos")'.dependencies]
midnight-curves = { path = "../curves" }
rayon = { workspace = true }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "dispatch2",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResidencySet",
    "MTLResource",
    "MTLTypes",
] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "block2"] }

[dev-dependencies]
midnight-metal = { path = ".", features = ["test-support"] }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
midnight-curves = { path = "../curves" }
midnight-circuits = { path = "../circuits", features = ["testing"] }
midnight-proofs = { path = "../proofs", features = ["gpu-test", "circuit-params"] }
rayon = { workspace = true }
