name: Cargo Test With Cache
description: Restore cache, run tests, save cache with rust-cache + sccache

inputs:
  package:
    required: true
  args:
    required: false

runs:
  using: "composite"
  steps:
    - name: 'Install rust-toolchain.toml'
      shell: bash
      run: rustup toolchain install

    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ inputs.package }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: true
        shared-key: "ci"

    - name: Run cargo test
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        ARGS: ${{ inputs.args }}
      # ARGS is deliberately unquoted: it carries multiple cargo flags.
      run: |
        # shellcheck disable=SC2086
        cargo test -p "$PACKAGE" $ARGS
