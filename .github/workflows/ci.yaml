name: CI checks

on:
  workflow_dispatch: # so cargo-audit-fix.yml can dispatch CI on its fix branch
  pull_request:
    # Draft runs skip the test jobs, and a skipped required check counts as
    # passing, so re-run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  download-srs:
    runs-on: ubuntu-latest
    outputs:
      srs-cache-hit: ${{ steps.restore-srs.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore SRS from cache
        id: restore-srs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - name: Download SRS if not cached
        if: steps.restore-srs.outputs.cache-hit != 'true'
        run: |
          mkdir -p zk_stdlib/examples/assets
          curl -L -o zk_stdlib/examples/assets/bls_filecoin_2p19 \
            https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/bls_filecoin_2p19

  audit:
    # Not in the merge queue: the advisory DB is fetched live, so a new
    # advisory published after approval would eject every queued PR.
    if: github.event_name != 'merge_group'
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout base branch Cargo.lock
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: Cargo.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit

      # PRs fail only on advisories they introduce. Ones already on the base
      # branch are warnings here and get fixed there by cargo-audit-fix.yml,
      # so an unrelated new advisory never forces a PR to be re-reviewed.
      - name: Cargo audit (advisories introduced by this PR)
        if: github.event_name == 'pull_request'
        run: .github/scripts/cargo-audit-diff.sh base/Cargo.lock

      - name: Cargo audit
        if: github.event_name != 'pull_request'
        run: cargo audit

  test-blstrs:
    if: github.event.pull_request.draft == false
    name: Test blstrs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-curves
          args: --release --all-features

  test-circuits:
    if: github.event.pull_request.draft == false
    name: Test circuits
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo tree -e features -p midnight-curves
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-circuits
          args: --release

  test-zk-stdlib:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test zk-stdlib
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore SRS from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --skip serialization
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release --test serialization -- --test-threads=1
      - name: Check for changes in goldenfiles/examples.
        run: |
          if ! git diff --quiet -- zk_stdlib/goldenfiles/examples; then
            echo "Files in zk_stdlib/goldenfiles/examples have changed"
            echo 'Run "cargo test -p midnight-zk-stdlib --release --test check_vks" locally and commit the changes'
            git diff -- zk_stdlib/goldenfiles/examples
            exit 1
          else
            echo "No changes in goldenfiles/examples"
          fi

  # Checks that the benchmark workloads prove and verify. It does not time
  # them: shared runners are too noisy for that.
  test-benchmarks:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test benchmarks
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore SRS from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-benchmarks
          args: --release

  test-proofs:
    if: github.event.pull_request.draft == false
    name: Test proofs
    runs-on: ubuntu-26.04
    steps:
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libfontconfig1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-proofs
          args: --release
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-proofs
          args: --release --features profiling --test plonk_api

  test-aggregation:
    if: github.event.pull_request.draft == false
    name: Test Aggregation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-aggregation
          args: --release --all-features

  doc-links:
    if: github.event.pull_request.draft == false
    name: Intra-doc links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install
      - name: cargo fetch
        run: cargo fetch

      # Ensure intra-documentation links all resolve correctly
      # Requires #![deny(intra_doc_link_resolution_failure)] in crates.
      - name: Check intra-doc links
        run: cargo doc --workspace --document-private-items --no-deps

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Unstable rustfmt options change behaviour across nightlies, so bump this pin deliberately.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly-2026-05-29
          components: rustfmt
      - run: cargo +nightly-2026-05-29 fmt --all -- --check

  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy
    timeout-minutes: 30
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install

      # font required for benchmarking charts generation
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libfontconfig1-dev

      - name: Run Clippy
        if: always()
        run: cargo clippy --all-targets --all-features -- -Dwarnings

      - name: Run Clippy on `aggregation`
        if: always()
        run: cargo clippy -p midnight-aggregation --all-targets --all-features -- -Dwarnings
