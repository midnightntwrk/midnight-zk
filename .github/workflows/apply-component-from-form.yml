name: Apply component from form

# Dispatcher — calls the reusable workflow in midnightntwrk/workflows.
# Translates the issue form's Components dropdown into component:* labels.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: apply-component-from-form-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/workflows/.github/workflows/apply-component-from-form.yml@2a516da4425edff87dd8d080bfb1c4125866f727
