name: GPU prover image

# Pull requests that touch the GPU code or the container build the image for
# amd64 and arm64 (no push). Tags `gpu-prover-v*` build both architectures,
# push them by digest and publish one multi-arch tag to
# ghcr.io/<owner>/midnight-gpu-prover.
#
# Each architecture builds on a native runner: compiling the CUDA kernels
# under QEMU emulation takes too long.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "gpu/**"
      - "gpu-prover/**"
      - "proofs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpu-prover-image.yml"
  push:
    tags:
      - "gpu-prover-v*"

permissions:
  contents: read

jobs:
  scripts:
    if: github.event_name == 'pull_request'
    name: Container script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: CDI start gate
        run: SKIP_HOST=1 gpu-prover/container/check-cdi.test.sh

      - name: Test-seed image check
        run: gpu-prover/container/check-no-test-seed.test.sh

  build:
    if: github.event_name == 'pull_request'
    name: Build image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gpu-prover/container/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: midnight-gpu-prover:ci
          cache-from: type=gha,scope=gpu-prover-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=gpu-prover-${{ matrix.runner }}

      - name: No test-seed build in the image
        run: gpu-prover/container/check-no-test-seed.sh midnight-gpu-prover:ci

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gpu-prover-v')
    name: Push image (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # ghcr.io/${{ github.repository_owner }}/midnight-gpu-prover, in lower
        # case: GHCR refuses upper-case repository names.
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/midnight-gpu-prover" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image is built and checked before any push. The push step below
      # rebuilds from the same builder cache.
      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gpu-prover/container/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: midnight-gpu-prover:check

      - name: No test-seed build in the image
        run: gpu-prover/container/check-no-test-seed.sh midnight-gpu-prover:check

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gpu-prover/container/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tag
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Image name
        id: image
        # ghcr.io/${{ github.repository_owner }}/midnight-gpu-prover, in lower
        # case: GHCR refuses upper-case repository names.
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/midnight-gpu-prover" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=match,pattern=gpu-prover-v(.*),group=1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<<"${TAGS_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
