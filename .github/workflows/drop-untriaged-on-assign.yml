name: Drop untriaged on assign

# Dispatcher — calls the reusable workflow in midnightntwrk/.github.
# Removes status:untriaged once an issue is assigned and prioritised.
on:
  issues:
    types: [assigned]

permissions:
  issues: write

concurrency:
  group: drop-untriaged-on-assign-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/.github/.github/workflows/drop-untriaged-on-assign.yml@90a3581fa1fc8136ea5de6cb43d7e4c82b223beb
