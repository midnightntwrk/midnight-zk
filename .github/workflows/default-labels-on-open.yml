name: Default labels on issue open

# Dispatcher — calls the reusable workflow in midnightntwrk/.github.
# Stamps status:untriaged on any issue opened without a status:* label.
on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: default-labels-on-open-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/.github/.github/workflows/default-labels-on-open.yml@90a3581fa1fc8136ea5de6cb43d7e4c82b223beb
