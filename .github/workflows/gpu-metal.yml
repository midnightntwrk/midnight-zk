name: GPU prover on Metal

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "metal/**"
      - "gpu-prover/**"
      - "proofs/**"
      - "circuits/**"
      - "curves/**"
      - "bench/gpu-prover/rc1/**"
      - "bench/gpu-prover/Cargo.toml"
      - "bench/gpu-prover/build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpu-metal.yml"
  merge_group:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  metal:
    name: Metal backend (Apple silicon)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gpu-metal

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Metal device
        run: system_profiler SPDisplaysDataType

      - name: Build midnight-metal and the daemon with the Metal binding
        run: cargo build --locked --release -p midnight-metal -p midnight-gpu-prover --features midnight-gpu-prover/metal

      - name: Clippy on the Metal crates
        run: cargo clippy --locked -p midnight-metal -p midnight-gpu-prover --all-targets --features midnight-gpu-prover/metal -- -D warnings

      - name: Build the rc.1 bench with the Metal hooks
        run: cargo build --locked --release -p midnight-gpu-prover-bench --features rc1-bench-metal

      - name: midnight-metal tests
        run: cargo test --locked --release -p midnight-metal

      - name: midnight-gpu-prover Metal tests
        env:
          MIDNIGHT_METAL_REQUIRE_DEVICE: "1"
        run: cargo test --locked --release -p midnight-gpu-prover --features metal,test-seed --test metal
