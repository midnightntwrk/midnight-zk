name: Scan
permissions: {}

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  merge_group: {}         # required check must report; the job skips (= passes) there
  workflow_dispatch: {}   # so you can still run it manually
  schedule:
    - cron: '0 0 * * *'   # run daily at midnight UTC
concurrency:
  group:
    ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - run: echo Skip
  scan:
    # Already gated at PR level, and re-run on push to main. In the queue its
    # tool and database downloads would only add flakes that eject PRs.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Scan code
        uses: midnightntwrk/upload-sarif-github-action@362d0346b194663004cb371e8e8523bd1c910917
