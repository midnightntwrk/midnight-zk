name: Default Origin on issue open

# Dispatcher — calls the reusable workflow in midnightntwrk/.github.
# Sets the Origin field to Public on new issues when unset.
on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: default-origin-on-open-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/.github/.github/workflows/default-origin-on-open.yml@90a3581fa1fc8136ea5de6cb43d7e4c82b223beb
