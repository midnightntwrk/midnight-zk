name: Default Origin on issue open

# Dispatcher — calls the reusable workflow in midnightntwrk/workflows.
# Sets the Origin field to Public on new issues when unset.
on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: default-origin-on-open-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    uses: midnightntwrk/workflows/.github/workflows/default-origin-on-open.yml@2a516da4425edff87dd8d080bfb1c4125866f727
